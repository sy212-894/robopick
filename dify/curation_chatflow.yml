          text: 'You rewrite a user''s question into an English search query for an
            English document collection about robot imitation learning datasets (robomimic,
            robosuite) and demonstration curation papers.


            Rules:

            - Translate the question as it is. Keep its meaning; do not answer it.

            - Do not add keywords, method names, or examples that are not in the question.

            - Keep proper nouns, field names, method names, and paper names exactly
            as written.

            - If the question is already in English, return it unchanged.

            - Output only the English query, one line, with no quotes or explanation.'
        - role: user
          text: '{{#sys.query#}}'
        reasoning_format: separated
        retry_config:
          enabled: true
          max_retries: 2
          retry_interval: 1000
        selected: false
        title: 질문 영어 변환
        type: llm
