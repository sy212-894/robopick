  features:
    file_upload:
      enabled: false
    opening_statement: 'robomimic Can 또는 Square(Multi-Human) 시범 300개에서 학습에 쓸 시범을 골라
      드립니다.


      할 수 있는 일: 작업 조건별 분포 분석, 예산(10~270개)에 맞춘 선별과 검수, 학습 승인 요청, 선별 근거 질문에 답하기 (출처
      표시)

      할 수 없는 일: Can·Square 외 다른 데이터셋, 대화 중 학습 실시간 실행'
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - can 데이터로 학습할 시범 150개 골라줘
    - square 데이터로 학습할 시범 150개 골라줘
    - 작업 조건별로 시범이 어떻게 분포돼 있는지만 보여줘
    - 일부 시범만 골라서 학습하려면 어떻게 설정해?
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
