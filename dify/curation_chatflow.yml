          [0-9A-Za-z][0-9A-Za-z_.-]*\\.hdf5\", q)\n    d = re.search(r\"(?<![A-Za-z0-9_])((?:can|square|lift|transport|tool_hang)_(?:mh|ph|mg|paired))(?![A-Za-z0-9_])\"\
          , q, re.I)\n    if f:\n        data_note = f\"사용자가 올린 파일 {f.group(0)}을 지정했다.\
