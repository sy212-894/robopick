app:
  description: 'MVP 4단계: 근거 검색 + 에이전트(MCP 도구) + 검수 + 사람 승인 + 보고'
  icon: 🤖
  icon_background: '#E0F2FE'
  icon_type: emoji
  mode: advanced-chat
  name: 시범데이터 선별 에이전트
  use_icon_as_answer_icon: false
