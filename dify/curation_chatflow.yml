    - data:
        code: "def main(kit: list, sel: list, pend: list) -> dict:\n    k = kit[0]\
          \ if kit else {}\n    s = sel[0] if sel else {}\n    p = pend[0] if pend\
          \ else {}\n    b = s.get(\"budget\")\n    n_sel = b.get(\"demos\") if isinstance(b,\
          \ dict) else b\n    if k.get(\"status\") != \"ok\":\n        return {\"\
          md\": f\"학습 키트를 만들지 못했습니다: {k.get('detail', k.get('status', '알 수 없음'))}\"\
          ,\n                \"brief\": \"학습 키트를 만들지 못했다\", \"head\": f\"{n_sel}개로\
          \ 골랐습니다\"}\n    rid = k.get(\"run_id\")\n    base = f\"/api/kit/{rid}\"\n\
          \    files = k.get(\"kit_files\") or {}\n    data = k.get(\"data_file\"\
          ) or {}\n    lines = [\"## 학습 키트\", \"\", \"아래 파일을 받아 Colab, Kaggle 또는 리눅스\
          \ GPU 서버에서 노트북을 위에서부터 실행하면 됩니다.\", \"\"]\n    if data.get(\"exists\"):\n\
          \        lines.append(f\"- [고른 데이터 {data['file']}]({base}/{data['file']})\
          \ ({data.get('size_mb')}MB, 묶음별 필터 키 포함)\")\n    for name in (\"train_curated.ipynb\"\
          , \"train_compare.ipynb\"):\n        f = files.get(name)\n        if f:\n\
          \            mins = k.get('minutes_per_run')\n            t = f\"T4 GPU\
          \ 약 {mins * f['runs']}분\" if mins else '시간은 측정 안 됨'\n            lines.append(f\"\
          - [{f['title']} 노트북]({base}/{name}): 학습 {f['runs']}개, {t} → 결과를 올리면 {f['after']}\"\
          )\n    lines.append(f\"- [학습 설정 train_settings.json]({base}/train_settings.json)\
          \ · [사용법 README.txt]({base}/README.txt)\")\n    lines.append(\"\")\n   \
          \ lines.append(f\"끝나면 결과 폴더의 `results_main_{k.get('fingerprint')}.json`을\
          \ 웹 화면에 올리면 판정합니다.\")\n    ev = s.get(\"evidence\") or {}\n    rows = ev.get(\"\
          rows\") or []\n    if rows:\n        lines += [\"\", \"## 근거 (이 방법으로 고른\
          \ 학습 실험)\", \"\",\n                  \"| 데이터 · 개수 | 선별 성공률 | 무작위 성공률 | 전체\
          \ 성공률 | 선별 - 무작위 | 전체 대비 하락 5%p 이내 |\", \"|---|---|---|---|---|---|\"]\n\
          \        for r in rows:\n            rt = r.get(\"rates\") or {}\n     \
          \       pct = lambda x: f\"{x['rate']:.0%}\" if x else \"-\"\n         \
          \   g, dr = r.get(\"gain_vs_random\") or {}, r.get(\"drop_vs_full\") or\
          \ {}\n            gain = f\"{g['diff'] * 100:+.1f}%p {g['verdict']}\" if\
          \ g else \"-\"\n            drop = (\"확인됨\" if dr.get(\"confirmed\") else\
          \ \"확인 안 됨\") if dr else \"-\"\n            lines.append(f\"| {r['dataset']}\
          \ · {r['budget']}개 | {pct(rt.get('curated'))} | {pct(rt.get('random'))}\
          \ | {pct(rt.get('train'))} | {gain} | {drop} |\")\n        if ev.get(\"\
          status\") == \"not_tested\":\n            lines.append(\"\")\n         \
          \   lines.append(f\"고른 개수({n_sel}개)는 직접 실험한 개수가 아니라 가까운 개수의 결과입니다.\")\n\
          \    elif ev.get(\"status\") == \"no_evidence\":\n        lines += [\"\"\
          , \"이 데이터는 학습 실험 결과가 없어, 이렇게 고르면 학습이 나아지는지는 확인되지 않았습니다. 비교 학습 노트북으로 직접 확인할\
          \ 수 있습니다.\"]\n    rl = rule_line(p.get(\"rule_check\"))\n    if rl:\n  \
          \      lines += [\"\", rl]\n    plan = ((p.get(\"diagnosis\") or {}).get(\"\
          collection_plan\")) or []\n    if plan:\n        lines += [\"\", \"## 수집\
          \ 계획 (선택)\", \"\", \"시범이 부족한 위치입니다. 더 모은다면 아래 개수만큼 (효과는 실험하지 않음)\", \"\"\
          ]\n        lines += [f\"- {c['cell']}: x {c['x'][0]}~{c['x'][1]}, y {c['y'][0]}~{c['y'][1]}\
          \ · 지금 {c['have']}개 → {c['collect']}개 더\" for c in plan]\n    brief = (f\"\
          사람이 개수를 확정해 {n_sel}개를 골랐고 검수를 통과했다. 학습 키트(데이터, 노트북 2종, 설정)를 만들었다. \"\n \
          \            f\"근거 {'있음' if rows else '없음'}. 수치는 답변 아래 표에 코드가 붙인다. 다음 단계는\
          \ 사용자가 자기 환경에서 노트북을 실행하고 결과 파일을 올리는 것\")\n    basis = s.get(\"budget_basis\"\
          )\n    return {\"md\": \"\\n\".join(lines), \"brief\": brief, \"head\":\
          \ f\"{n_sel}개로 골랐습니다\" + (f\" · 개수 근거: {basis}\" if basis else \"\")}\n\n\
          \ndef rule_line(rc):\n    if not rc:\n        return \"\"\n    if rc.get(\"\
          status\") != \"checked\":\n        return f\"**규칙 점검: 점검 불가**: {rc.get('note')}\"\
          \n    h = rc.get(\"skilled_share\") or {}\n    top, bot = h.get(\"top\"\
          ), h.get(\"bottom\")\n    ci = rc.get(\"ci95\") or [0, 0]\n    extra = f\"\
          \ 점수 상위 절반의 숙련자(better) 비율 {top:.0%}, 하위 절반 {bot:.0%}.\" if top is not None\
          \ else \"\"\n    return (f\"**규칙 점검: {rc['verdict']}** (숙련도 라벨 {rc.get('n_labeled')}개,\
          \ 품질 점수와 숙련도 순위 상관 \"\n            f\"{rc.get('score_spearman')}, 95% 구간\
          \ {ci[0]}~{ci[1]}).{extra} {rc.get('note')}\")\n"
        code_language: python3
        outputs:
          md:
            children: null
            type: string
          brief:
            children: null
            type: string
          head:
            children: null
            type: string
        selected: false
        title: 학습 키트·근거 정리
        type: code
        variables:
