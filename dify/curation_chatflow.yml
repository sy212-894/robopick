          \ · 선별 후보 {p.get('n_candidates')}개\"]\n    if p.get(\"split_note\"):\n \
          \       lines.append(f\"- {p['split_note']}\")\n    lines.append(\"\")\n\
          \    lines.append(\"**진단** (선별 전에 보는 정보, 선별 방법은 바꾸지 않음)\")\n    low = cov.get(\"\
          low_cells\") or []\n    if low:\n        lines.append(f\"- 위치 편중: 같은 넓이\
          \ 칸 평균 {cov.get('mean')}개, 평균의 절반 미만인 칸 {len(low)}개\")\n        lines.append(\"\
          \")\n        lines.append(\"| 칸 | x 범위 (m) | y 범위 (m) | 시범 수 | 더 모을 개수 |\"\
          )\n        lines.append(\"|---|---|---|---|---|\")\n        for c in low:\n\
          \            lines.append(f\"| {c['cell']} | {c['x'][0]}~{c['x'][1]} | {c['y'][0]}~{c['y'][1]}\
          \ | {c['count']} | {c['need']} |\")\n        lines.append(\"\")\n      \
          \  lines.append(\"수집 계획은 평균 수준까지 더 모을 개수이며, 이렇게 모으면 성공률이 오르는지는 실험하지 않았습니다.\"\
          )\n    else:\n        lines.append(f\"- 위치 편중: 같은 넓이 칸 평균 {cov.get('mean')}개,\
          \ 부족한 칸 없음\")\n    n_dup = dup.get(\"n_pairs\", 0)\n    closest = dup.get(\"\
          closest_m\")\n    closest_txt = f\", 가장 가까운 쌍 {closest * 100:.1f}cm\" if\
          \ isinstance(closest, (int, float)) else \"\"\n    lines.append(f\"- 거의\
