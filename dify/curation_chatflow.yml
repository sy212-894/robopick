    - data:
        code: "def main(res: list) -> dict:\n    r = res[0] if res else {}\n    if\
          \ r.get(\"status\") == \"no_result\" or not r.get(\"kind\"):\n        return\
          \ {\"md\": \"이 대화에서 올린 학습 결과가 없습니다. 학습 키트로 학습한 뒤 결과 파일을 웹 화면에 올리면 판정합니다.\"\
          }\n    pct = lambda x: f\"{x['rate']:.0%} ({x['success']}/{x['rollouts']},\
          \ 95% 신뢰구간 {x['ci95'][0]:.0%}~{x['ci95'][1]:.0%})\"\n    names = {\"curated\"\
          : \"선별\", \"random\": \"무작위\", \"train\": \"전체\"}\n    lines = [f\"## {r.get('title')}\"\
          , \"\", f\"데이터 {r.get('dataset')} · 선별 {r.get('budget')}개 · {r.get('epoch')}\
          \ epoch · 학습 환경 {r.get('platform') or '-'}\", \"\"]\n    lines += [\"| 묶음\
          \ | 성공률 |\", \"|---|---|\"]\n    for role, x in (r.get(\"rates\") or {}).items():\n\
          \        lines.append(f\"| {names.get(role, role)} | {pct(x)} |\")\n   \
          \ if r.get(\"kind\") == \"effect\":\n        lines += [\"\", \"**판정** (같은\
          \ 시험 위치끼리 짝지은 비교, 코드가 계산)\"]\n        g, d = r.get(\"gain_vs_random\"),\
          \ r.get(\"drop_vs_full\")\n        if g:\n            lines.append(f\"-\
          \ 선별 - 무작위: {g['diff'] * 100:+.1f}%p (95% 신뢰구간 {g['ci95'][0] * 100:+.1f}~{g['ci95'][1]\
          \ * 100:+.1f}%p) → {g['verdict']}\")\n        if d:\n            lines.append(f\"\
          - 전체 - 선별 (하락 5%p 이내인지): {d['diff'] * 100:+.1f}%p (위쪽 끝 {d['ci95'][1] *\
          \ 100:+.1f}%p) → {'하락 기준 충족' if d.get('confirmed') else '하락 기준 확인 안 됨'}\"\
          )\n        for m in r.get(\"missing\") or []:\n            lines.append(f\"\
          - {names.get(m, m)} 묶음 결과가 없어 그 비교는 하지 않았습니다\")\n    ev = r.get(\"evidence\"\
          ) or {}\n    rows = ev.get(\"rows\") or []\n    if rows:\n        lines\
          \ += [\"\", \"**우리 실험의 비슷한 결과** (같은 방법으로 고른 학습 실험)\", \"\"]\n        for\
          \ e in rows:\n            rt = e.get(\"rates\") or {}\n            part\
          \ = \", \".join(f\"{names[k]} {v['rate']:.0%}\" for k, v in rt.items() if\
