    nodes:
    - data:
        context:
          enabled: false
          variable_selector: []
        model:
          completion_params:
            max_tokens: 1024
            temperature: 0
          mode: chat
          name: google/gemma-4-26b-a4b-it
          provider: langgenius/openrouter/openrouter
        prompt_template:
        - role: system
          text: '너는 로봇 시범 데이터 선별 에이전트의 보고 담당이다. 사람이 진단을 보고 고를 개수를 확정했고, 선별과 검수를 마쳤고,
            학습 키트를 만들었다.

            아래 자료로 한국어 최종 보고를 작성하라.

            규칙:

            - 숫자는 자료에 있는 값만 그대로 쓴다. 새로 계산하거나 추정하지 않는다.

            - "최적", "가장 좋은" 같은 표현을 쓰지 않는다. 학습은 아직 하지 않았으므로 성능을 평가하는 표현을 쓰지 않는다.

            - 학습 키트 파일 목록, 근거 표, 수집 계획은 답변 아래에 코드가 붙인다. 그 내용을 옮겨 쓰지 말고 "학습 키트와 근거는
            아래 참고"라고만 쓴다.

            - 자료의 대괄호 제목([...])이나 안내 문구를 답변에 옮기지 않는다. 표나 목록이 들어갈 자리(빈 칸, "이곳에 ..."
            같은 문구)를 만들지 않는다.

            - 이미 개수를 확정한 뒤의 보고다. 확정이나 승인을 앞으로 할 일로 쓰지 않는다.

            - 수집 계획(부족한 칸에 더 모으기)이 성공률을 높인다고 쓰지 않는다 (실험하지 않았다).

            - 근거 출처는 자료에 문서 제목이나 URL이 있을 때만 적고, 없으면 생략한다.

            코드 블록(```)과 표를 쓰지 않는다. 줄글과 짧은 목록만 쓴다.

            형식: 요약 1문장 / 선별 결과 핵심 수치 3~5줄 / 다음 단계 1줄(학습 키트로 자기 환경에서 학습한 뒤 결과 파일을 올리면
            판정) / 근거 출처(있으면).


            [에이전트 작업 내용]

            {{#agent_out.output#}}


            [진단]

            {{#diag.diag_md#}}


            [선별과 검수]

            {{#plan.brief#}}


            [학습 키트 상태]

            {{#kit_md.brief#}}'
        - role: user
          text: '{{#sys.query#}}'
        reasoning_format: separated
        retry_config:
