    - data:
        code: "def main(review: list) -> dict:\n    r = review[0] if review else {}\n\
          \    verdict = r.get(\"verdict\", \"none\")\n    issues = r.get(\"issues\"\
          , []) + r.get(\"warnings\", [])\n    issues_md = \"\\n\".join(f\"- {i['check']}:\
          \ {i['detail']}\" for i in issues) or \"- 없음\"\n    plan_md = \"\"\n   \
          \ if verdict in (\"pass\", \"revise\"):\n        sets = r.get(\"sets\",\
          \ {})\n        rows = \"\\n\".join(f\"| {k} | {v['n_demos']} | {v['total_frames']:,}\
          \ |\" for k, v in sets.items())\n        tp = r.get(\"training_plan\", {})\n\
          \        plan_md = (\n            f\"**선별 결과** run_id `{r.get('run_id')}`\
          \ (예산 {r.get('budget')}개)\\n\\n\"\n            f\"| 묶음 | 시범 수 | 총 프레임 |\\\
          n|---|---|---|\\n{rows}\\n| train (전체) | 270 | 56,186 |\\n\\n\"\n      \
          \      f\"**검수 결과**: {verdict}\\n{issues_md}\\n\\n\"\n            f\"**학습\
          \ 계획**: 위 {tp.get('n_sets', 0)}개 묶음을 같은 설정(robomimic BC, 시드 1)으로 학습하고 MuJoCo\
          \ 롤아웃으로 성공률 비교\\n\"\n            f\"예상 시간 약 {tp.get('est_minutes', 0)}분\
          \ ({tp.get('note', '')}). 승인하면 코랩 GPU를 사용하며 되돌릴 수 없습니다.\"\n        )\n \
          \   return {\"verdict\": verdict, \"run_id\": r.get(\"run_id\") or \"\"\
          , \"plan_md\": plan_md, \"issues_md\": issues_md}"
        code_language: python3
        outputs:
          issues_md:
            children: null
            type: string
          plan_md:
            children: null
            type: string
          run_id:
            children: null
