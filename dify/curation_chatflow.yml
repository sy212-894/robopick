          ) or []:\n            same = \" → 우리 실험을 그대로 재현했습니다\" if m[\"same_trials\"\
          ] == m[\"n\"] else \"\"\n            lines.append(f\"- 같은 학습 계획·같은 시드의 우리\
          \ 실험({m.get('experiment')}, 시드 {m['seed']}) {m['ours']}과 비교: \"\n      \
          \                   f\"시험 {m['n']}번 중 {m['same_trials']}번 결과가 같음{same}\"\
          )\n        if ev.get(\"same_plan\") and not ev.get(\"reproduce\"):\n   \
